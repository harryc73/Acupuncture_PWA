<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="
      base-uri 'self';
      default-src 'self';
      style-src 'self' cdnjs.cloudflare.com 'unsafe-inline' www.instagram.com;
      script-src 'self' www.instagram.com;
      img-src 'self' data: cdninstagram.com;
      media-src 'self';
      font-src 'self';
      connect-src 'self';
      object-src 'self';
      worker-src 'self';
      frame-src 'self' www.instagram.com le-acupuncture.au2.cliniko.com www.google.com https://cdn.tiny.cloud;
      form-action 'self';
      manifest-src 'self'
    "
    />
    <link rel="stylesheet" type="text/css" href="static/css/style.css" />
    <title>{% block title %}{{ title or site_name }}{% endblock %}</title>
    <meta name="description" content="{{ meta_description or default_description }}" />
    <meta name="robots" content="{{ meta_robots or 'index,follow' }}" />
    <link rel="canonical" href="{{ canonical or (base_url + request.path) }}" />
    <meta property="og:site_name" content="{{ site_name }}" />
    <meta property="og:title" content="{{ og_title or title or site_name }}" />
    <meta property="og:description" content="{{ og_description or meta_description or default_description }}" />
    <meta property="og:url" content="{{ og_url or (base_url + request.path) }}" />
    <meta property="og:type" content="{{ og_type or 'website' }}" />
    <meta property="og:image" content="{{ og_image or (base_url + '/static/images/acupuncture-needling.jpg') }}" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="{{ og_title or title or site_name }}" />
    <meta name="twitter:description" content="{{ og_description or meta_description or default_description }}" />
    <meta name="twitter:image" content="{{ og_image or (base_url + '/static/images/acupuncture-needling.jpg') }}" />
    <link rel="manifest" href="static/manifest.json" />
    <link rel="icon" type="image/x-icon" href="static/images/favicon.png" />
    <meta name="theme-color" content="#ffffff" />
    <link href="static/css/bootstrap.min.css" rel="stylesheet" />
    {# JSON-LD structured data for Organization + WebSite #}
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "name": "{{ site_name }}",
          "url": "{{ base_url }}",
          "logo": "{{ base_url }}/static/images/logo.png",
          "sameAs": []
        },
        {
          "@type": "WebSite",
          "name": "{{ site_name }}",
          "url": "{{ base_url }}",
          "potentialAction": {
            "@type": "SearchAction",
            "target": "{{ base_url }}/?s={search_term_string}",
            "query-input": "required name=search_term_string"
          }
        }
      ]
    }
    </script>
  </head>
  <body>
    <div class="main-background">
      {% include "partials/menu.html" %} {% block content %}{% endblock %} {%
      include "partials/footer.html" %}
      <script src="static/js/bootstrap.bundle.min.js"></script>
      <script src="static/js/serviceWorker.js"></script>
      <script src="static/js/app.js"></script>
    </div>
  </body>
</html>
