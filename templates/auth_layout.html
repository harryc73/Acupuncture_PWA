<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" type="text/css" href="static/css/style.css" />
    <title>{% block title %}{{ title or site_name }}{% endblock %}</title>
    <meta name="description" content="{{ meta_description or default_description }}" />
    <link rel="canonical" href="{{ canonical or (base_url + request.path) }}" />
    <meta property="og:title" content="{{ og_title or title or site_name }}" />
    <meta property="og:description" content="{{ og_description or meta_description or default_description }}" />
    <meta property="og:url" content="{{ og_url or (base_url + request.path) }}" />
    <meta property="og:image" content="{{ og_image or (base_url + '/static/images/acupuncture-needling.jpg') }}" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="manifest" href="static/manifest.json" />
    <link rel="icon" type="image/x-icon" href="static/images/favicon.png" />
    <meta name="theme-color" content="#ffffff" />
    <link href="static/css/bootstrap.min.css" rel="stylesheet" />
  </head>
  <body>
    <div class="main-background">
      {% block content %}{% endblock %} {%include "partials/footer.html" %}
      <script src="static/js/bootstrap.bundle.min.js"></script>
      <script src="static/js/serviceWorker.js"></script>
      <script src="static/js/app.js"></script>
    </div>
  </body>
</html>
