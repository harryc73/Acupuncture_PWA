{% extends "auth_layout.html" %} {% block content %}
<div class="main-background">
  <section class="vh-100">
    <div class="container py-5 h-100">
      <div class="row d-flex justify-content-center align-items-center h-100">
        <div class="col col-xl-10 image">
          <div class="card p-3" style="border-radius: 1rem">
            <div class="row g-0">
                <div class="col-md-6 col-lg-5 d-none d-md-block image">
                <img
                  src="static/images/chinese accents.png"
                  alt="Le Acupuncture login image"
                  class="img-fluid fade-up-in"
                  style="border-radius: 1rem 0 0 1rem"
                  loading="lazy"
                  rounded
                />
              </div>
              <div class="col-md-6 col-lg-7 d-flex align-items-center">
                <div class="card-body p-4 p-lg-5 text-black">
                  <form
                    method="POST"
                    action="admin_login.html"
                    class="fade-up-in"
                  >
                    <input
                      type="hidden"
                      name="csrf_token"
                      value="{{ csrf_token() }}"
                    />
                    <div class="d-flex align-items-center mb-3 pb-1">
                      <span class="h1">Admin Login</span>
                    </div>

                    <h5
                      class="fw-normal mb-3 pb-3 white-text"
                      style="letter-spacing: 1px"
                    >
                      Sign into the Admin account
                    </h5>
                    <div data-mdb-input-init class="form-outline mb-4">
                      <input
                        name="username"
                        type="username"
                        id="form2Example17"
                        class="form-control form-control-lg"
                      />
                      <label class="form-label" for="form2Example17"
                        >Admin Username</label
                      >
                      {% if error %}
                      <br />
                      <span
                        id="lower"
                        class="red-text"
                        style="color: red !important"
                        >• Incorrect Username or password</span
                      ><br />
                      {% endif %}
                    </div>

                    <div data-mdb-input-init class="form-outline mb-4">
                      <input
                        type="password"
                        name="password"
                        id="form2Example27"
                        class="form-control form-control-lg"
                      />
                      <label class="form-label" for="form2Example27"
                        >Password</label
                      >
                    </div>

                    <div class="pt-1 mb-4">
                      <button
                        data-mdb-button-init
                        data-mdb-ripple-init
                        class="btn btn-dark btn-lg btn-block btn-secondary"
                        type="submit"
                      >
                        Login
                      </button>
                    </div>
                  </form>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>
</div>
{% endblock %}
